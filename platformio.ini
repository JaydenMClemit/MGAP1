[env:nanorp2040connect]
platform = raspberrypi
board = nanorp2040connect
framework = arduino
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	hideakitai/PCA95x5@^0.1.3
	arduino-libraries/Arduino_LSM6DSOX@^1.1.2
	mprograms/QMC5883LCompass@^1.2.3
	pololu/VL6180X@^1.4.0
	arduino-libraries/Servo@^1.3.0
	arduino-libraries/WiFiNINA@^2.1.1
	semcneil/Anitracks_ADS7142@^0.1.5
	adafruit/Adafruit NeoPixel@1.5.0
	adafruit/Adafruit ST7735 and ST7789 Library
